name: Actualización semanal de Firestore

on:
  schedule:
  - cron: '0 9 * * 1'
  workflow_dispatch: 

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v2

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.2'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Crear archivo config
        run: |
          echo '${{ secrets.CONFIG_FIREBASE }}' | base64 --decode > update_service/config.json

      - name: Crear archivo certificado
        run: |
          echo '${{ secrets.FIREBASE_CERT }}' | base64 --decode > update_service/flixfindertv-1f381-firebase-adminsdk-fbsvc-b62fc4096c.json

      - name: Ejecutar script
        run: |
          cd update_service
          python database_update_service.py
