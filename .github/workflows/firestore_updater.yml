name: Actualización semanal de Firestore

#on:
  #schedule:
    #- cron: '0 9 * * 1'  # Lunes a las 09:00 UTC
  #workflow_dispatch:      # Ejecutable también manualmente

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v2

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13.2'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Crear archivo de configuración desde secret
      - name: Crear archivo config.yaml
        run: echo "${{ secrets.CONFIG_FIREBASE }}" > update_service/config.json

      # Crear archivo certificado Firebase desde secret
      - name: Crear archivo firebase_cert.json
        run: echo "${{ secrets.FIREBASE_CERT }}" > update_service/firebase_cert.json

      - name: Ejecutar script
        run: python update_service/database_update_service.py
